<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant full stack</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/app.css">
</head>

<body>

    <header class="py-4 bg-primary">
        <h1 class="text-center text-white fs-3">Restaurant full stack</h1>
    </header>

    <div class="d-flex mt-4 justify-content-center">
        <button data-bs-toggle="modal" data-bs-target="#formulario" type="button" class="btn btn-success">Nueva
            Orden</button>
    </div>


    <main id="menu" class="container bg-light mt-5 p-4 d-none">
        <h2 class="text-center my-4">Pedidos</h2>

        <div class="contenido"></div>
    </main>


    <section id="resumen" class="resumen bg-light container mt-5 p-4 d-none">
        <h2 class="text-center my-4">Resumen del pedido</h2>

        <div class="contenido row">
            <p class="text-center">Añade los elementos del pedido</p>
        </div>

        <div class="mt-3">
            <label for="propina" class="form-label">Propina (%)</label>
            <input id="propina" type="number" class="form-control" min="0" max="100" step="1" value="10">
            <div id="error-propina" class="form-text text-danger" aria-live="polite"></div>
        </div>
        <div class="d-flex flex-wrap gap-2 mt-3">
            <button id="finalizar-orden" type="button" class="btn btn-primary" disabled>Finalizar orden</button>
            <button id="mostrar-ordenes" type="button" class="btn btn-outline-primary">Mostrar órdenes (0)</button>
        </div>
        <p id="ayuda-finalizar-orden" class="form-text">Agrega al menos un producto para habilitar «Finalizar orden».</p>
    </section>

    <section id="lista-ordenes" class="container bg-light mt-4 p-4 d-none">
        <h2 class="text-center my-4">Órdenes guardadas</h2>
        <div id="ordenes-guardadas"></div>
    </section>

    <!-- Modal -->
    <div class="modal fade" id="formulario">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title">Restaurant App</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form>
                        <div class="mb-3">
                            <label class="form-label">Mesa</label>
                            <input id="mesa" type="number" class="form-control" min="1" max="8">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Hora</label>
                            <input id="hora" type="time" class="form-control">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    <button id="guardar-cliente" type="button" class="btn btn-primary">Crear Orden</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/index.js"></script>
</body>

</html>
